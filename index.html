<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gridwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one-screen app. Name bar, menus, toolbar, formula bar, scrolling grid with floating charts, sheet tabs, status bar. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --head: #e5eaf0;
  --head-sel: #cfdeea;
  --line: #d6dce3;
  --fg: #1b232c;
  --muted: #5b6672;
  --accent: #1d5f86;
  --accent-fg: #ffffff;
  --accent-soft: rgba(29, 95, 134, 0.12);
  --err: #b3261e;
  --freeze: #8ea3b6;
  --note: #e0a100;
  --bd: #1b232c;
  --shadow: rgba(16, 24, 32, 0.16);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --row-h: 26px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151a; --panel: #161c22; --head: #1d252d; --head-sel: #24394a; --line: #2a333c;
    --fg: #e2e8ee; --muted: #93a0ad; --accent: #6db2da; --accent-fg: #0d1a24;
    --accent-soft: rgba(109, 178, 218, 0.17); --err: #ff8a80; --freeze: #4d6476; --note: #e8b42a;
    --bd: #c9d3dc; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151a; --panel: #161c22; --head: #1d252d; --head-sel: #24394a; --line: #2a333c;
  --fg: #e2e8ee; --muted: #93a0ad; --accent: #6db2da; --accent-fg: #0d1a24;
  --accent-soft: rgba(109, 178, 218, 0.17); --err: #ff8a80; --freeze: #4d6476; --note: #e8b42a;
  --bd: #c9d3dc; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  display: flex; flex-direction: column; overflow: hidden;
  padding-inline: 16px; padding-block: 8px; box-sizing: border-box; gap: 6px;
}
button, input, select, textarea { font: inherit; color: inherit; }

.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 600; letter-spacing: 0.04em; font-size: 12px; color: var(--accent); text-transform: uppercase; }
#docName {
  flex: 1 1 160px; min-width: 0; font-size: 17px; font-weight: 600; border: 1px solid transparent;
  background: transparent; padding: 2px 6px; border-radius: 4px;
}
#docName:hover { border-color: var(--line); }
#docName:focus { border-color: var(--accent); outline: none; background: var(--panel); }
.files { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 5px;
  padding: 5px 10px; font-size: 13px; cursor: pointer; line-height: 1.2; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
.btn.danger { color: var(--err); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.menubar { display: flex; gap: 1px; flex-wrap: wrap; margin-block: -3px; }
.menubtn { border: 0; background: transparent; padding: 3px 9px; border-radius: 4px; font-size: 13px; cursor: pointer; }
.menubtn:hover, .menubtn[aria-expanded="true"] { background: var(--head); }

.toolbar { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; }
.tool {
  min-width: 30px; height: 30px; padding: 0 7px; border: 1px solid transparent; background: transparent;
  border-radius: 5px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.tool svg { width: 16px; height: 16px; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--panel); border-color: var(--line); }
.tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.tool:disabled { opacity: 0.4; cursor: default; background: transparent; border-color: transparent; }
.tool .chip { display: block; width: 16px; height: 4px; border-radius: 1px; margin-top: 1px; border: 1px solid var(--line); box-sizing: border-box; }
.tool .stack { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
#numFmt {
  height: 30px; border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 0 4px; font-size: 13px; max-width: 150px;
}

.fxbar { display: flex; gap: 6px; align-items: stretch; }
#nameBox {
  width: 84px; flex: none; text-align: center; font-family: var(--font-mono); font-size: 13px;
  border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 5px;
}
.fxlabel { align-self: center; font-family: var(--font-mono); font-style: italic; color: var(--muted); font-size: 13px; }
#fx {
  flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 13px; border: 1px solid var(--line);
  background: var(--panel); border-radius: 5px; padding: 5px 8px;
}
#fx:focus, #nameBox:focus { outline: none; border-color: var(--accent); }
.gridwrap:focus-visible { outline: none; }

.findbar {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px;
}
.findbar input[type="text"] {
  width: 170px; min-width: 0; flex: 0 1 170px; border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 4px 7px;
}
.findbar label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); white-space: nowrap; }
#findStatus { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 70px; }
.findbar .close { margin-left: auto; }

.gridwrap {
  flex: 1; min-height: 0; overflow: auto; position: relative; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; overscroll-behavior: contain;
}
table#grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13px; }
#grid th, #grid td { height: var(--row-h); box-sizing: border-box; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
#grid thead th {
  position: sticky; top: 0; z-index: 6; background: var(--head); font-weight: 500; color: var(--muted);
  font-size: 12px; user-select: none;
}
#grid thead th .rz { position: absolute; right: -4px; top: 0; width: 8px; height: 100%; cursor: col-resize; z-index: 1; }
#grid tbody th {
  position: sticky; left: 0; z-index: 4; background: var(--head); font-weight: 500; color: var(--muted);
  font-size: 12px; text-align: center; user-select: none; font-variant-numeric: tabular-nums;
}
#grid thead th.fc { z-index: 7; }
#grid thead th.corner { left: 0; z-index: 8; }
#grid tbody th.fr { z-index: 5; }
#grid th.hl { background: var(--head-sel); color: var(--fg); }
#grid td {
  padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: cell;
  font-variant-numeric: tabular-nums; user-select: none; background-color: var(--panel);
}
#grid td.n { text-align: right; }
#grid td.c { text-align: center; }
#grid td.b { font-weight: 600; }
#grid td.i { font-style: italic; }
#grid td.w { white-space: pre-wrap; overflow-wrap: anywhere; text-overflow: clip; padding-block: 3px; }
#grid td.e { color: var(--err); text-align: center; font-family: var(--font-mono); font-size: 12px; }
#grid td.note { background-image: linear-gradient(225deg, var(--note) 6px, transparent 6px); }
#grid td.in { background-image: linear-gradient(var(--accent-soft), var(--accent-soft)); }
#grid td.note.in { background-image: linear-gradient(225deg, var(--note) 6px, transparent 6px), linear-gradient(var(--accent-soft), var(--accent-soft)); }
#grid td.act { outline: 2px solid var(--accent); outline-offset: -2px; }
#grid td.fr, #grid td.fc { position: sticky; z-index: 1; }
#grid td.fr { z-index: 2; }
#grid td.fr.fc { z-index: 3; }
#grid td.frb, #grid tbody th.frb { border-bottom: 2px solid var(--freeze); }
#grid td.fcb, #grid thead th.fcb { border-right: 2px solid var(--freeze); }

#fillHandle {
  position: absolute; z-index: 1; width: 8px; height: 8px; box-sizing: border-box;
  background: var(--accent); border: 1px solid var(--panel); cursor: crosshair; touch-action: none;
}
#fillHandle::after { content: ""; position: absolute; inset: -6px; }
#fillPreview {
  position: absolute; z-index: 2; box-sizing: border-box; pointer-events: none;
  border: 2px dashed var(--accent); background: var(--accent-soft);
}
body.filling, body.filling td { cursor: crosshair; }
#cellEditor {
  position: absolute; z-index: 9; box-sizing: border-box; border: 2px solid var(--accent);
  background: var(--panel); font-family: var(--font-mono); font-size: 13px; padding: 0 5px; outline: none;
  box-shadow: 0 2px 10px var(--shadow);
}

.chart {
  position: absolute; z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
  box-shadow: 0 6px 22px var(--shadow); display: flex; flex-direction: column; overflow: hidden;
  resize: both; min-width: 260px; min-height: 190px; max-width: 1400px;
}
.chart header {
  display: flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-bottom: 1px solid var(--line);
  cursor: move; user-select: none; touch-action: none; font-size: 12px; color: var(--muted);
}
.chart header span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart header button { border: 0; background: transparent; cursor: pointer; padding: 3px 7px; border-radius: 4px; font-size: 12px; color: var(--fg); }
.chart header button:hover { background: var(--head); }
.chart .cbody { flex: 1; min-height: 0; position: relative; padding: 6px; }
.chart canvas { position: absolute; inset: 6px; }
.chart .nolib { padding: 16px; color: var(--muted); font-size: 13px; }

.tabs { display: flex; align-items: center; gap: 4px; overflow-x: auto; min-height: 32px; flex: none; }
.tab {
  display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--head); border-radius: 5px;
  padding: 0 10px; font-size: 13px; cursor: pointer; white-space: nowrap; height: 28px; flex: none;
}
.tab.on { background: var(--panel); border-color: var(--accent); color: var(--accent); font-weight: 500; padding-right: 2px; }
.tab .caret { border: 0; background: transparent; cursor: pointer; padding: 2px 6px; color: inherit; border-radius: 3px; }
.tab .caret:hover { background: var(--accent-soft); }
.tab:not(.on) .caret { display: none; }
.addtab { border: 1px dashed var(--line); background: transparent; border-radius: 5px; height: 28px; width: 30px; cursor: pointer; flex: none; font-size: 16px; }
.addtab:hover { border-color: var(--accent); }

.status {
  display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums; min-height: 18px;
}
.status b { color: var(--fg); font-weight: 500; }
#saveState { margin-left: auto; }
#saveState.dirty::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #c98a1b; margin-right: 6px; vertical-align: 1px; }

.menu {
  position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
  box-shadow: 0 10px 30px var(--shadow); padding: 4px; min-width: 220px; max-height: calc(100% - 16px); overflow: auto; box-sizing: border-box;
}
.mi {
  display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 18px; border: 0; background: transparent;
  padding: 6px 10px; border-radius: 4px; font-size: 13px; text-align: left; cursor: pointer;
}
.mi:hover, .mi:focus { background: var(--accent-soft); outline: none; }
.mi:disabled { opacity: 0.45; cursor: default; background: transparent; }
.mi kbd { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.mi .chk { width: 14px; display: inline-block; color: var(--accent); }
.msep { height: 1px; background: var(--line); margin: 4px 2px; }
.mlabel { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 6px 10px 2px; }
.swatches { display: grid; grid-template-columns: repeat(8, 22px); gap: 5px; padding: 4px 6px 8px; }
.sw { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); cursor: pointer; padding: 0; }
.sw:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
.popline { display: flex; gap: 8px; align-items: center; padding: 4px 6px; font-size: 13px; }
.popline input[type="color"] { width: 34px; height: 24px; border: 1px solid var(--line); padding: 0; background: none; }
.bgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
.bgrid button { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 6px 4px; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.bgrid button:hover { border-color: var(--accent); }
.bgrid svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.bgrid svg .faint { stroke: var(--line); stroke-dasharray: 2 2; }

.tip {
  position: fixed; z-index: 60; max-width: 280px; background: var(--fg); color: var(--bg); padding: 6px 9px;
  border-radius: 5px; font-size: 12px; line-height: 1.45; pointer-events: none; white-space: pre-wrap;
}
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 70;
  max-width: calc(100% - 32px);
}
.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.42); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal .card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 16px;
  width: min(640px, 100%); display: flex; flex-direction: column; gap: 12px; max-height: 92%; overflow: auto; box-sizing: border-box;
}
.modal h2 { margin: 0; font-size: 16px; }
.modal p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.modal textarea, .fld {
  box-sizing: border-box; font-size: 13px; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
  border-radius: 5px; padding: 5px 7px; min-width: 0;
}
.modal textarea { width: 100%; min-height: 120px; resize: vertical; font-family: var(--font-mono); font-size: 12px; }
.modal textarea.plain { font-family: var(--font-ui); font-size: 13px; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.form { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 12px; align-items: center; font-size: 13px; }
.form > label:not(.inline) { color: var(--muted); }
.form .inline { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; }
.form .pair { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.form .pair .fld { flex: 1 1 120px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 4px 0 -4px; }
.series { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content max-content; gap: 6px 8px; align-items: center; font-size: 13px; }
.series .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 0; }
.series .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rules { display: flex; flex-direction: column; gap: 6px; }
.rule { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.rule .prev { padding: 1px 8px; border-radius: 3px; border: 1px solid var(--line); font-size: 12px; }
.rule .what { flex: 1; min-width: 0; }
.empty { color: var(--muted); font-size: 13px; }
.help { font-size: 13px; line-height: 1.55; }
.help h3 { font-size: 13px; margin: 10px 0 2px; }
.help code { font-family: var(--font-mono); font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 3px; }
.help ul { margin: 0; padding-left: 18px; }
.help p { color: var(--fg); }

#printArea { display: none; }
@media print {
  @page { margin: 12mm; }
  html, body { height: auto; overflow: visible; background: #fff; color: #000; display: block; padding: 0; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block; --bd: #000; color: #000; font-family: var(--font-ui); }
  #printArea h1 { font-size: 15px; margin: 0 0 8px; }
  #printArea table { border-collapse: collapse; font-size: 11px; table-layout: fixed; }
  #printArea td { border: 1px solid #c8c8c8; padding: 2px 5px; white-space: nowrap; overflow: hidden; height: 18px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #printArea td.n { text-align: right; } #printArea td.c { text-align: center; } #printArea td.b { font-weight: 600; } #printArea td.i { font-style: italic; }
  #printArea td.w { white-space: pre-wrap; }
  #printArea img { display: block; max-width: 100%; margin-top: 14px; break-inside: avoid; }
}

@media (max-width: 600px) {
  .brand { display: none; }
  #docName { font-size: 15px; }
  .fxlabel { display: none; }
  #nameBox { width: 62px; }
  .sep { display: none; }
  .tool { min-width: 30px; padding: 0 6px; }
  .form { grid-template-columns: minmax(0, 1fr); }
  .series { grid-template-columns: max-content minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

</head>
<body>
<div class="topbar">
  <span class="brand">Gridwork</span>
  <input id="docName" aria-label="File name" value="Monthly budget" spellcheck="false">
  <div class="files">
    <button class="btn" id="btnOpen">Open</button>
    <button class="btn primary" id="btnSave">Save JSON</button>
  </div>
  <input type="file" id="fileInput" accept=".json,.csv,.tsv,.txt,.xlsx,.xls,application/json,text/csv" hidden>
</div>

<nav class="menubar" id="menubar" aria-label="Menus">
  <button class="menubtn" data-menu="File" aria-haspopup="menu" aria-expanded="false">File</button>
  <button class="menubtn" data-menu="Edit" aria-haspopup="menu" aria-expanded="false">Edit</button>
  <button class="menubtn" data-menu="View" aria-haspopup="menu" aria-expanded="false">View</button>
  <button class="menubtn" data-menu="Insert" aria-haspopup="menu" aria-expanded="false">Insert</button>
  <button class="menubtn" data-menu="Format" aria-haspopup="menu" aria-expanded="false">Format</button>
  <button class="menubtn" data-menu="Data" aria-haspopup="menu" aria-expanded="false">Data</button>
  <button class="menubtn" data-menu="Help" aria-haspopup="menu" aria-expanded="false">Help</button>
</nav>

<div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
  <button class="tool" id="tUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16"><path d="M5 3 2 6l3 3"/><path d="M2 6h7.5a4 4 0 0 1 0 8H7"/></svg></button>
  <button class="tool" id="tRedo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 16 16"><path d="m11 3 3 3-3 3"/><path d="M14 6H6.5a4 4 0 0 0 0 8H9"/></svg></button>
  <span class="sep"></span>
  <select id="numFmt" title="Number format" aria-label="Number format">
    <option value="">General</option>
    <option value="num">Number 1,234.56</option>
    <option value="int">Whole 1,235</option>
    <option value="cur">Currency $1,234.56</option>
    <option value="pct">Percent 12.5%</option>
    <option value="date">Date 10/14/2026</option>
    <option value="datel">Date Oct 14, 2026</option>
  </select>
  <button class="tool" id="tCur" title="Currency" aria-pressed="false">$</button>
  <button class="tool" id="tPct" title="Percent" aria-pressed="false">%</button>
  <span class="sep"></span>
  <button class="tool" id="tBold" title="Bold (Ctrl+B)" aria-pressed="false"><b>B</b></button>
  <button class="tool" id="tItal" title="Italic (Ctrl+I)" aria-pressed="false"><i style="font-family:Georgia,serif">I</i></button>
  <button class="tool" id="tColor" title="Text color" aria-label="Text color"><span class="stack"><b style="font-size:14px">A</b><span class="chip" id="chipColor" style="background:#c62828"></span></span></button>
  <button class="tool" id="tFill" title="Fill color" aria-label="Fill color"><span class="stack"><svg viewBox="0 0 16 16" style="height:12px"><path d="M3 8 8 3l5 5-5 5z"/><path d="M13.5 10.5c.7 1 1 1.6 1 2a1 1 0 0 1-2 0c0-.4.3-1 1-2z"/></svg><span class="chip" id="chipFill" style="background:#fff4c2"></span></span></button>

$("docName").addEventListener("input", markDirty);
$("docName").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); wrap.focus(); } });
$("nameBox").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return; e.preventDefault();
  const rg = parseRange($("nameBox").value);
  if (!rg || rg.r2 >= S.rows || rg.c2 >= S.cols) { toast("Type an address like B7 or B7:D12"); renderSel(); return; }
  sel = { ar: rg.r1, ac: rg.c1, fr: rg.r2, fc: rg.c2 };
  renderSel(); scrollToCell(rg.r1, rg.c1); wrap.focus({ preventScroll: true });
});

// =====================================================================
// Keyboard
// =====================================================================
document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (!$("modal").hidden) { if (e.key === "Escape") closeModal(); return; }
  if (!menuEl.hidden && menuEl.contains(e.target)) return;
  if (!menuEl.hidden && e.key === "Escape") { closeMenu(); return; }
  if (mod && k === "s") { e.preventDefault(); if (editing) commitEdit(); saveJson(); return; }
  if (mod && k === "o") { e.preventDefault(); $("fileInput").click(); return; }
  if (mod && k === "p") { e.preventDefault(); printSheet(); return; }
  if (mod && (k === "f" || k === "h")) { e.preventDefault(); if (editing) commitEdit(); openFind(k === "h"); return; }
  if (typingTarget(e.target) || editing) return;
  if (mod) {
    if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
    else if (k === "b") { e.preventDefault(); toggleFmt("b", true); }
    else if (k === "i") { e.preventDefault(); toggleFmt("i", true); }
    else if (k === "d") { e.preventDefault(); fillFromEdge("down"); }
    else if (k === "r") { e.preventDefault(); fillFromEdge("right"); }
    else if (k === "a") { e.preventDefault(); sel = { ar: 0, ac: 0, fr: S.rows - 1, fc: S.cols - 1 }; renderSel(); }
    else if (e.key === "PageDown") { e.preventDefault(); if (doc.active < doc.sheets.length - 1) setActive(doc.active + 1); }
    else if (e.key === "PageUp") { e.preventDefault(); if (doc.active > 0) setActive(doc.active - 1); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const dr = e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0, dc = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      let r = e.shiftKey ? sel.fr : sel.ar, c = e.shiftKey ? sel.fc : sel.ac;
      const filled = (rr, cc) => rr >= 0 && cc >= 0 && rr < S.rows && cc < S.cols && isFilled(rr, cc);
      if (filled(r, c) && filled(r + dr, c + dc)) { while (filled(r + dr, c + dc)) { r += dr; c += dc; } }
      else { r += dr; c += dc; while (r >= 0 && c >= 0 && r < S.rows && c < S.cols && !filled(r, c)) { r += dr; c += dc; } }
      setSel(clamp(r, 0, S.rows - 1), clamp(c, 0, S.cols - 1), e.shiftKey);
    }
    return;
  }
  const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (moves[e.key]) {
    e.preventDefault(); const [dr, dc] = moves[e.key];
    if (e.shiftKey) setSel(sel.fr + dr, sel.fc + dc, true); else moveActive(dr, dc);
  } else if (e.key === "Tab") { e.preventDefault(); moveActive(0, e.shiftKey ? -1 : 1); }
  else if (e.key === "F2" && e.shiftKey) { e.preventDefault(); openNote(); }
  else if (e.key === "Enter" || e.key === "F2") { e.preventDefault(); startEdit(null, "cell"); }
  else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); forSel((c) => { c.v = ""; return c; }); }
  else if (e.key === "Home") { e.preventDefault(); setSel(sel.ar, 0); }
  else if (e.key === "PageDown" || e.key === "PageUp") { e.preventDefault(); const step = Math.max(5, Math.floor(wrap.clientHeight / 26) - 2); setSel(sel.ar + (e.key === "PageDown" ? step : -step), sel.ac); }
  else if (e.key === "Escape") { if (!$("findBar").hidden) closeFind(); else setSel(sel.ar, sel.ac); }
  else if (e.key.length === 1 && !e.altKey) { e.preventDefault(); startEdit(e.key, "cell"); }
});

// =====================================================================
// Toast and modals
// =====================================================================
let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600); }
let modalReturn = null;
function openModal(html) { closeMenu(); if (!modalReturn) modalReturn = document.activeElement; $("modalCard").innerHTML = html; $("modal").hidden = false; const f = $("modalCard").querySelector("input,select,textarea,button"); if (f) f.focus({ preventScroll: true }); }
function closeModal() { $("modal").hidden = true; $("modalCard").innerHTML = ""; const r = modalReturn; modalReturn = null; (r && r.isConnected && r !== document.body ? r : wrap).focus({ preventScroll: true }); }
$("modal").addEventListener("pointerdown", (e) => { if (e.target === $("modal")) closeModal(); });
function showTextModal(title, text, filename) {
  openModal(`<h2>${esc(title)}</h2><p>File saving is not available in this view. Copy the text below and save it as <b>${esc(filename)}</b> in any text editor.</p>
    <textarea id="mText" readonly></textarea><div class="row"><button class="btn" id="mClose">Close</button><button class="btn primary" id="mCopy">Copy</button></div>`);
  $("mText").value = text; $("mClose").onclick = closeModal;
  $("mCopy").onclick = () => {
    const ta = $("mText");
    navigator.clipboard.writeText(text).then(() => { toast("Copied"); }, () => { ta.focus(); ta.select(); toast("Text selected. Press Ctrl+C to copy."); });
  };
}
function showMessage(title, body) {
  openModal(`<h2>${esc(title)}</h2><p>${esc(body)}</p><div class="row"><button class="btn primary" id="mClose">OK</button></div>`);
  $("mClose").onclick = closeModal;
}
const FN_GROUPS = {
  "Math": "SUM PRODUCT AVERAGE MEDIAN MIN MAX COUNT COUNTA COUNTBLANK ROUND ROUNDUP ROUNDDOWN CEILING FLOOR INT ABS SIGN SQRT POWER EXP LN LOG LOG10 MOD PI RAND RANDBETWEEN SUMPRODUCT",
  "Statistics": "STDEV STDEVP VAR LARGE SMALL RANK",
  "Conditional": "IF IFS IFERROR IFNA AND OR NOT SUMIF SUMIFS COUNTIF COUNTIFS AVERAGEIF AVERAGEIFS",
  "Lookup": "VLOOKUP HLOOKUP XLOOKUP INDEX MATCH CHOOSE",
  "Text": "CONCAT TEXTJOIN LEN LEFT RIGHT MID FIND SEARCH SUBSTITUTE UPPER LOWER PROPER TRIM REPT TEXT VALUE",
  "Dates": "TODAY NOW DATE DATEVALUE YEAR MONTH DAY WEEKDAY EDATE EOMONTH DAYS DATEDIF NETWORKDAYS",
  "Trig (radians)": "SIN COS TAN ASIN ACOS ATAN ATAN2 RADIANS DEGREES",
  "Money": "PMT FV PV",
  "Checks": "ISBLANK ISNUMBER ISTEXT ISERROR ISERR ISNA ISLOGICAL",
};
function showHelp(which) {
  const body = which === "fns"
    ? Object.entries(FN_GROUPS).map(([g, list]) => `<h3>${g}</h3><p>${list.split(" ").map((f) => `<code>${f}</code>`).join(" ")}</p>`).join("") +
      `<h3>Examples</h3><ul>
      <li><code>=VLOOKUP("Gas",A4:C9,3,FALSE)</code> finds Gas in column A and returns column C.</li>
      <li><code>=XLOOKUP(F2,A4:A9,C4:C9,"none")</code> does the same, with a fallback.</li>
      <li><code>=SUMIFS(C4:C9,A4:A9,"G*",C4:C9,"&gt;200")</code> adds C where A starts with G and C is over 200.</li>
      <li><code>=DATEDIF(B2,TODAY(),"Y")</code> gives whole years between two dates.</li>
      <li><code>=TEXT(B2,"mmmm d, yyyy")</code> and <code>=TEXT(C5,"$#,##0.00")</code> format values as text.</li>
      <li><code>=Budget!B11</code> or <code>='Lab data'!C4</code> reads a cell on another sheet.</li></ul>`
    : `<ul>
      <li>Start a formula with <code>=</code>, like <code>=B4-C4</code> or <code>=SUM(B4:B9)</code>. While typing a formula, click a cell to insert its address. Whole columns work too: <code>=SUM(B:B)</code>.</li>
      <li><b>Fill handle:</b> drag the small square at the corner of the selection to copy formulas down or across. Double-click it to fill down as far as the column beside it has data. Two numbers fill a series, a date counts up by days, and text like "Week 1" counts up. Ctrl+D fills down and Ctrl+R fills right.</li>
      <li><b>Rows and columns:</b> right-click a row number, column letter, or cell to insert or delete. Formulas adjust automatically.</li>
      <li><b>Sheets:</b> use + at the bottom to add a sheet. Click the arrow on the current tab to rename, duplicate, move, or delete it. Ctrl+PageUp and Ctrl+PageDown switch sheets.</li>
      <li><b>Charts:</b> select your data and click Chart. Pick the shared x column, then set each series to the left or right axis to plot two quantities with different units. Drag a chart by its title bar and resize it from the bottom-right corner.</li>
      <li><b>Dates:</b> type 10/14/2026, 2026-10-14, or Oct 14, 2026. Dates are numbers underneath, so <code>=B2+30</code> is 30 days later.</li>
      <li><b>Freeze:</b> the View menu keeps header rows or the first column in place while you scroll.</li>
      <li><b>Find:</b> Ctrl+F finds, Ctrl+H replaces. Check All sheets to search everywhere.</li>
      <li><b>Notes:</b> Shift+F2 or right-click to add a note. A yellow corner marks cells with notes.</li>
      <li><b>Keys:</b> Ctrl+arrow jumps to the edge of your data, Shift+arrow selects, Enter or F2 edits, Delete clears, Ctrl+Z undoes, Ctrl+B bold, Ctrl+I italic, Ctrl+S saves JSON. Double-click a column edge to fit its width. Start an entry with an apostrophe to keep it as text, like <code>'00123</code>.</li>
      <li><b>Files:</b> your work autosaves in this browser. Save JSON to keep a real copy. The File menu exports Excel and CSV, and Open reads JSON, CSV, and Excel files.</li></ul>`;
  openModal(`<h2>${which === "fns" ? "Functions" : "Using Gridwork"}</h2><div class="help">${body}</div><div class="row"><button class="btn primary" id="mClose">Close</button></div>`);
  $("mClose").onclick = closeModal;
}

function sampleDoc() {
  const budget = newSheet("Budget"), lab = newSheet("Lab data");
  const put = (sh, id, v, extra) => (sh.cells[id] = Object.assign({ v: String(v) }, extra || {}));
  put(budget, "A1", "Monthly budget (example data)", { b: true });
  ["Category", "Budget", "Actual", "Difference", "% used"].forEach((h, i) => put(budget, colName(i) + "3", h, Object.assign({ b: true, bd: "b" }, i ? { a: "r" } : {})));
  [["Mortgage", 1200, 1200], ["Groceries", 650, 712.4], ["Utilities", 280, 251.18], ["Gas", 220, 238], ["Insurance", 160, 160], ["Giving", 300, 300]].forEach(([cat, b, a], i) => {
    const r = i + 4;
    put(budget, "A" + r, cat); put(budget, "B" + r, b, { f: "cur" }); put(budget, "C" + r, a, { f: "cur" });
    put(budget, "D" + r, `=B${r}-C${r}`, { f: "cur" }); put(budget, "E" + r, `=C${r}/B${r}`, { f: "pct" });
  });
  put(budget, "A11", "Total", { b: true, bd: "t" });
  put(budget, "B11", "=SUM(B4:B9)", { f: "cur", b: true, bd: "t" }); put(budget, "C11", "=SUM(C4:C9)", { f: "cur", b: true, bd: "t" });
  put(budget, "D11", "=B11-C11", { f: "cur", b: true, bd: "t" }); put(budget, "E11", "=C11/B11", { f: "pct", b: true, bd: "t" });
  put(budget, "A13", "Lines over budget"); put(budget, "B13", '=COUNTIF(D4:D9,"<0")', { n: "Counts the rows where Actual is more than Budget." });
  put(budget, "A14", "Status"); put(budget, "B14", '=IF(D11>=0,"On track","Over budget")');
  put(budget, "A15", "Updated"); put(budget, "B15", "=TODAY()", { f: "datel" });
  budget.widths = { A: 170, E: 80 };
  budget.cond = [{ id: uid(), range: { r1: 3, c1: 3, r2: 10, c2: 3 }, kind: "neg", a: "", b: "", style: { fc: "#c62828" } }];
  budget.freeze = { r: 3, c: 0 };

  put(lab, "A1", "Cart rolling down a ramp (example data)", { b: true });
  put(lab, "E3", "a (m/s²)", { b: true, a: "r" }); put(lab, "E4", "0.8", { bg: "#fff4c2", n: "Acceleration. Change it and the table and chart update." });
  ["Time (s)", "Position (m)", "Velocity (m/s)"].forEach((h, i) => put(lab, colName(i) + "3", h, { b: true, a: "r", bd: "b" }));
  for (let i = 0; i <= 10; i++) {
    const r = i + 4;
    put(lab, "A" + r, i); put(lab, "B" + r, `=0.5*$E$4*A${r}^2`, { f: "num" }); put(lab, "C" + r, `=$E$4*A${r}`, { f: "num" });
  }
  lab.widths = { A: 80, B: 110, C: 120, E: 80 };
  lab.charts = [{ id: uid(), kind: "combo", title: "Position and velocity vs. time", range: { r1: 2, c1: 0, r2: 14, c2: 2 }, header: true, xCol: 0, xMode: "auto",
    series: [{ c: 1, type: "line", axis: "L" }, { c: 2, type: "line", axis: "R" }], xTitle: "Time (s)", yLTitle: "Position (m)", yRTitle: "Velocity (m/s)", x: 560, y: 30, w: 540, h: 340 }];
  return { sheets: [budget, lab], active: 0, name: "Monthly budget" };
}
function boot() {
  let loaded = null;
  try {
    const s = localStorage.getItem(AUTO_KEY); if (s) loaded = JSON.parse(s);
    if (!loaded) { const old = localStorage.getItem("gridwork.autosave.v1"); if (old) { const o = JSON.parse(old); loaded = { name: o.name, sheets: [{ name: "Sheet1", cells: o.cells, columnWidths: o.widths }], v1: true }; } }
  } catch { loaded = null; }
  let d = null;
  if (loaded && Array.isArray(loaded.sheets) && loaded.sheets.length) {
    try {
      d = loaded.v1 ? { sheets: loaded.sheets.map((x, i) => sheetFromData(x, "Sheet" + (i + 1))), active: 0, name: loaded.name }
        : { sheets: loaded.sheets.map((x) => ({ ...newSheet(x.name || "Sheet"), ...x, freeze: x.freeze || { r: 0, c: 0 }, merges: x.merges || [], cond: x.cond || [], charts: x.charts || [] })), active: clamp(loaded.active || 0, 0, loaded.sheets.length - 1), name: loaded.name };
      dirtySinceFile = !!loaded.dirty; lastFileSave = loaded.lastFileSave ? new Date(loaded.lastFileSave) : null;
    } catch { d = null; }
  }
  if (!d) { d = sampleDoc(); dirtySinceFile = false; }
  doc.sheets = d.sheets; doc.active = d.active; S = doc.sheets[doc.active];
  $("docName").value = d.name || "Untitled";
  recalc(); buildGrid(); renderCells(); renderTabs(); renderCharts(); renderSaveState();
  setSel(0, 0); wrap.focus({ preventScroll: true });
}
window.addEventListener("resize", () => { if (editing && !ed.hidden) positionEditor(); closeMenu(); });
boot();
window.__gridwork = { get doc() { return doc; }, get S() { return S; }, values, setActive, chartInst };
})();
